aid: pluro
name: Pluro
description: 'Pluro is India''s fertility and IVF platform, built as a co-creation
  model with doctors for patients. It delivers personalised, evidence-based reproductive
  care through a growing network of 15+ clinics across India, combining advanced clinical
  science, AI-assisted embryology, standardised treatment protocols, and transparent
  pricing. Founded by Dr. Bhaskar Shah, Dr. Jaydeep Tank, and Dr. Parikshit Tank,
  Pluro raised a Rs 125 crore Series A led by Bessemer Venture Partners in 2025. It
  offers IVF/ICSI, IUI, ovulation induction, and a range of diagnostic and surgical
  fertility treatments. Pluro publishes an llms.txt for AI agents but exposes no public
  developer API.'
